<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>In-browser check (Pyodide)</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 16px/1.5 "Segoe UI", Arial, sans-serif; margin: 2rem; }
    .pass { color: #157a3c; } .fail { color: #b3261e; }
    pre { background: #f0f2f5; padding: .5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>In-browser check</h1>
  <p>Runs every reference solution in tasks.json, and one variant of every template in templates.json, through the real Pyodide worker, and checks that an infinite loop is stopped by the timeout. Serve the project folder and open <code>/tests/browser-check.html</code>.</p>
  <p id="status">Loading Pyodide…</p>
  <pre id="log"></pre>
  <p id="summary"></p>

  <script src="../checker.js"></script>
  <script src="../templates.js"></script>
  <script>
  "use strict";
  const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
  const status = (s) => { document.getElementById("status").textContent = s; };

  function runInWorker(worker, code, tests) {
    return new Promise((resolve) => {
      const results = [];
      const id = Math.random();
      worker.onmessage = (e) => {
        const m = e.data;
        if (m.type === "load-error") resolve({ loadError: m.message });
        if (m.id !== id) return;
        if (m.type === "progress") results[m.index] = m.result;
        if (m.type === "done") resolve({ results });
      };
      worker.postMessage({ type: "run", id, code, tests });
    });
  }

  (async () => {
    const bank = await (await fetch("../tasks.json")).json();
    // Also one variant of every template (seed 1).
    const templates = await (await fetch("../templates.json")).json();
    const tasks = bank.concat(templates.map((t) => Templates.expand(t, 1)));
    const worker = new Worker("../worker.js");
    await new Promise((res) => {
      worker.onmessage = (e) => {
        if (e.data.type === "ready") res();
        if (e.data.type === "load-error") { status("Pyodide failed to load: " + e.data.message); }
      };
    });
    status("Pyodide ready – running solutions…");

    let failed = 0, passedTests = 0;
    for (const t of tasks) {
      const r = await runInWorker(worker, t.solution, t.tests.map((x) => x.inputs));
      t.tests.forEach((test, i) => {
        const res = r.results[i];
        if (!res.error && Checker.outputsMatch(res.output, test.expected)) passedTests++;
        else { failed++; log("FAIL " + t.id + " test " + (i + 1) + ": " + JSON.stringify(res)); }
      });
    }
    log("Solutions: " + passedTests + " tests passed, " + failed + " failed");

    // Infinite loop: the worker never replies, so terminate after 5 seconds and check a fresh worker works.
    const start = performance.now();
    const loopWorker = new Worker("../worker.js");
    await new Promise((res) => { loopWorker.onmessage = (e) => { if (e.data.type === "ready") res(); }; });
    const timedOut = await Promise.race([
      runInWorker(loopWorker, "while True:\n    pass", [[]]).then(() => false),
      new Promise((res) => setTimeout(() => res(true), 5000)),
    ]);
    loopWorker.terminate();
    const elapsed = Math.round(performance.now() - start);
    log("Infinite loop stopped by timeout: " + (timedOut ? "yes" : "NO") + " (" + elapsed + " ms incl. load)");
    if (!timedOut) failed++;

    // input() replacement and stdout-only capture.
    const io = await runInWorker(worker, "name = input('Name: ')\nif name == 'Sam':\n    print('Hi Sam')", [["Sam"]]);
    const ioOk = io.results[0].output === "Hi Sam\n";
    log("input() supplies test inputs, prompt not captured: " + (ioOk ? "yes" : "NO " + JSON.stringify(io.results[0])));
    if (!ioOk) failed++;

    const summary = document.getElementById("summary");
    summary.className = failed ? "fail" : "pass";
    summary.textContent = failed ? "BROWSER CHECK FAILED (" + failed + ")" : "BROWSER CHECK PASSED";
    status("Finished");
  })();
  </script>
</body>
</html>
