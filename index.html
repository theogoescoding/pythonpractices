<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Practice</title>
  <link rel="icon" type="image/png" href="assets/logo/icon-light.png">
  <link rel="stylesheet" href="styles.css">
  <!-- The home page opens in the Dark theme (with the dark logo) unless the visitor has chosen a theme. -->
  <script>self.DEFAULT_THEME = "dark";</script>
  <script src="store.js"></script>
</head>
<body class="landing-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- The home page every visitor sees first. Students go to the student view (app.html), teachers to teacher.html.
       It only links to the existing join and sign-in screens: it has no sign-in code of its own. -->
  <header class="landing-tools">
    <span id="display-tools"></span>
  </header>

  <main id="main" class="landing" tabindex="-1">
    <div class="landing-logo">
      <h1 class="landing-logo-h">
        <img class="logo-for-light" src="assets/logo/logo-main-light.png" width="366" height="406" alt="Python Practice">
        <img class="logo-for-dark" src="assets/logo/logo-main-dark.png" width="398" height="392" alt="Python Practice">
      </h1>
      <p class="landing-tagline">Climb through the units of Python programming, one rung at a time, with practice that adapts to you.</p>
    </div>

    <nav class="landing-buttons landing-students" aria-label="Students">
      <h2 class="landing-label">Students</h2>
      <a class="landing-button" href="app.html#join">New student</a>
      <a class="landing-button" href="app.html#signin">Returning student</a>
    </nav>

    <nav class="landing-buttons landing-teachers" aria-label="Teachers">
      <h2 class="landing-label">Teachers</h2>
      <a class="landing-button" href="teacher.html#signup">New teacher</a>
      <a class="landing-button" href="teacher.html#signin">Returning teacher</a>
    </nav>
  </main>

  <script>Store.setupDisplaySettings();</script>
</body>
</html>
